name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run isolated backend tests
        run: >-
          python -m pytest -q
          tests/test_rate_limit.py
          tests/test_config.py
          tests/test_kiosk_security.py
          tests/test_security_current_user.py
          tests/test_schema_bootstrap.py
          tests/test_payroll_components.py
          tests/test_rules.py
          tests/test_attendance_validation.py
          tests/test_reports.py
          tests/test_user_validation.py
        working-directory: backend
      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.txt
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
        working-directory: frontend
      - name: Audit frontend runtime dependencies
        run: npx --yes yarn@1.22.22 audit --groups dependencies
        working-directory: frontend
      - name: Build frontend
        run: npx --yes yarn@1.22.22 build
        working-directory: frontend
